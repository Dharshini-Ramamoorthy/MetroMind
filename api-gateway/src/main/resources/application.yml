server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "https://*.vercel.app"
              - "https://*.netlify.app"
              - "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service

        - id: fleet-service
          uri: lb://FLEET-SERVICE
          predicates:
            - Path=/api/v1/fleet/**,/api/v1/ledger/**
          filters:
            - name: CircuitBreaker
              args:
                name: fleetServiceCB
                fallbackUri: forward:/fallback/fleet-service

        - id: schedule-service
          uri: lb://SCHEDULE-SERVICE
          predicates:
            - Path=/api/v1/schedule/**
          filters:
            - name: CircuitBreaker
              args:
                name: scheduleServiceCB
                fallbackUri: forward:/fallback/schedule-service

        - id: maintenance-service
          uri: lb://MAINTENANCE-SERVICE
          predicates:
            - Path=/api/v1/maintenance/**
          filters:
            - name: CircuitBreaker
              args:
                name: maintenanceServiceCB
                fallbackUri: forward:/fallback/maintenance-service

        - id: alert-service
          uri: lb://ALERT-SERVICE
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - name: CircuitBreaker
              args:
                name: alertServiceCB
                fallbackUri: forward:/fallback/alert-service

        - id: report-service
          uri: lb://REPORT-SERVICE
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - name: CircuitBreaker
              args:
                name: reportServiceCB
                fallbackUri: forward:/fallback/report-service

        - id: approver-service
          uri: lb://APPROVER-SERVICE
          predicates:
            - Path=/api/approver/**
          filters:
            - name: CircuitBreaker
              args:
                name: approverServiceCB
                fallbackUri: forward:/fallback/approver-service

        - id: forecast-service
          uri: ${FORECAST_SERVICE_URL:http://localhost:8002}
          predicates:
            - Path=/api/v1/forecast/**


eureka:
  client:
    username: ${EUREKA_USER:eureka}
    password: ${EUREKA_PASSWORD:eureka123}
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
      fleetServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
      scheduleServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
      maintenanceServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
      alertServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
      reportServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
      approverServiceCB:
        register-health-indicator: true
        sliding-window-size: 20
        minimum-number-of-calls: 10
        permitted-number-of-calls-in-half-open-state: 5
        wait-duration-in-open-state: 5s
        failure-rate-threshold: 80
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 15s
  timelimiter:
    instances:
      userServiceCB:
        timeout-duration: 15s
      fleetServiceCB:
        timeout-duration: 15s
      scheduleServiceCB:
        timeout-duration: 15s
      maintenanceServiceCB:
        timeout-duration: 15s
      alertServiceCB:
        timeout-duration: 15s
      reportServiceCB:
        timeout-duration: 15s
      approverServiceCB:
        timeout-duration: 15s

gateway.internal-secret: ${GATEWAY_INTERNAL_SECRET}

jwt.secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    io.github.resilience4j: INFO

