server.port=8086
spring.application.name=schedule-service

# ============================================================
# MongoDB
# ============================================================

spring.data.mongodb.uri=mongodb://localhost:27017/kmrl_schedule_db
spring.data.mongodb.auto-index-creation=true

# ============================================================
# Fleet Service
# ============================================================

# Discovery is used by FleetClient.
# This property is only a fallback/reference.
fleet-service.url=http://localhost:8085

# ============================================================
# CORS
# ============================================================

schedule.cors.allowed-origins=http://localhost:5173

# ============================================================
# Logging
# ============================================================

logging.level.com.kce.kmrl.schedule=DEBUG

# ============================================================
# Eureka Client
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Force registration with loopback address so api-gateway (also on localhost)
# can resolve this instance. Without this, prefer-ip-address picks up the
# LAN IP (e.g. 10.58.16.80) which the gateway cannot route to locally.
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ============================================================
# Security
# ============================================================

schedule.security.gateway-secret=

internal.service-secret=

# ============================================================
# Resilience4j - Fleet Service
# ============================================================

resilience4j.circuitbreaker.instances.fleetService.register-health-indicator=true
resilience4j.circuitbreaker.instances.fleetService.sliding-window-size=10
resilience4j.circuitbreaker.instances.fleetService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.fleetService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.fleetService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fleetService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fleetService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.fleetService.slow-call-duration-threshold=3s

resilience4j.retry.instances.fleetService.max-attempts=3
resilience4j.retry.instances.fleetService.wait-duration=500ms

# ============================================================
# Resilience4j - Maintenance Service
# ============================================================

resilience4j.circuitbreaker.instances.maintenanceService.register-health-indicator=true
resilience4j.circuitbreaker.instances.maintenanceService.sliding-window-size=10
resilience4j.circuitbreaker.instances.maintenanceService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.maintenanceService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.maintenanceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.maintenanceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.maintenanceService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.maintenanceService.slow-call-duration-threshold=3s

resilience4j.retry.instances.maintenanceService.max-attempts=3
resilience4j.retry.instances.maintenanceService.wait-duration=500ms

# ============================================================
# Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# ============================================================
# Schedule Generation
# ============================================================

schedule.public-holiday-dates=
schedule.festival-dates=
schedule.default-weather=Clear

# ============================================================
# Day Profile Headway Multipliers
# All multipliers set to 1.0 so the Python AI XGBoost model
# (which already takes day_of_week, is_weekend, is_holiday, and special_event)
# is the 100% single authority on demand-based headways without Java double-multiplying.
# ============================================================

schedule.day-profile.weekday-headway-multiplier=1.0
schedule.day-profile.saturday-headway-multiplier=1.0
schedule.day-profile.sunday-headway-multiplier=1.0
schedule.day-profile.public-holiday-headway-multiplier=1.0
schedule.day-profile.festival-headway-multiplier=1.0

# Direct URL to the Python/FastAPI forecast-service process.
# Must NOT use the logical Eureka name ("forecast-service") as hostname —
# that service never registers with Eureka. Always talk to it by host:port.
forecast.service.url=http://localhost:8002

# ============================================================
# KMRL Metro Safety & Infrastructure Configurations
# Real-world Kochi Metro (KMRL) Line 1 operations:
# Peak service: ~8 min (480s) headway
# Off-peak service: ~12 min (720s) headway
# Safety headway floor: 7 min (420s)
# ============================================================
schedule.min-departure-headway-seconds=420
schedule.min-arrival-headway-seconds=420
schedule.min-section-separation-seconds=120
schedule.min-platform-clearance-seconds=60
schedule.min-turnaround-minutes=3
schedule.min-dwell-minutes=2
schedule.min-terminal-recovery-minutes=3
schedule.max-terminal-idle-minutes=60
schedule.min-reserve-trains=2