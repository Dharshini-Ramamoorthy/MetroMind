server.port=8086
spring.application.name=approver-service

# Connects to the SAME MongoDB database as maintenance-service so it can
# read tickets from the shared "maintenance" collection and write approval
# history to the "approval_history" collection.
spring.data.mongodb.uri=mongodb://localhost:27017/maintenance_db

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Gateway secret
approver.security.gateway-secret=

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
