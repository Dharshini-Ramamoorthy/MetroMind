name: metromind-kmrl

services:
  # ============================================================================
  # Databases & Infrastructure
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: kmrl-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - kmrl-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: kmrl-oracle-db
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: admin
      APP_USER: system
      APP_USER_PASSWORD: admin
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - kmrl-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/checkDBStatus.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ============================================================================
  # Service Discovery (Eureka Server)
  # ============================================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: kmrl-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_USER: ${EUREKA_USER:-eureka}
      EUREKA_PASSWORD: ${EUREKA_PASSWORD:-eureka123}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    networks:
      - kmrl-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

  # ============================================================================
  # API Gateway
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: kmrl-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      FORECAST_SERVICE_URL: http://forecast-service:8002
    depends_on:

      eureka-server:
        condition: service_healthy
    networks:
      - kmrl-network

  # ============================================================================
  # Core Business Microservices
  # ============================================================================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: kmrl-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      SPRING_DATASOURCE_USERNAME: system
      SPRING_DATASOURCE_PASSWORD: admin
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      APPROVER_SERVICE_URL: http://approver-service:8088
    depends_on:
      eureka-server:
        condition: service_healthy
      oracle-db:
        condition: service_healthy
    networks:
      - kmrl-network

  fleet-service:
    build:
      context: ./fleet-service
      dockerfile: Dockerfile
    container_name: kmrl-fleet-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/kmrl_fleet_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  maintenance-service:
    build:
      context: ./maintenance-service
      dockerfile: Dockerfile
    container_name: kmrl-maintenance-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/maintenance_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  schedule-service:
    build:
      context: ./schedule-service
      dockerfile: Dockerfile
    container_name: kmrl-schedule-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/kmrl_schedule_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  approver-service:
    build:
      context: ./approver-service
      dockerfile: Dockerfile
    container_name: kmrl-approver-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SERVER_PORT: 8088
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/maintenance_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  alert-service:
    build:
      context: ./alert-service
      dockerfile: Dockerfile
    container_name: kmrl-alert-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/alert_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: kmrl-report-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/reports_db
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://${EUREKA_USER:-eureka}:${EUREKA_PASSWORD:-eureka123}@eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  # ============================================================================
  # AI & Python Analytics Service
  # ============================================================================
  forecast-service:
    build:
      context: ./forecast-service
      dockerfile: Dockerfile
    container_name: kmrl-forecast-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      MONGO_URI: mongodb://mongodb:27017/kmrl_forecast_db
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kmrl-network

  # ============================================================================
  # MetroMind Frontend UI
  # ============================================================================
  metromind-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kmrl-ui
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - kmrl-network

# ==============================================================================
# Networks & Persistent Storage
# ==============================================================================
networks:
  kmrl-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  oracle_data:
    driver: local
