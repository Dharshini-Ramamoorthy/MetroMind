# Service Identity & Port
spring.application.name=approver-service
server.port=8088

# MongoDB Connection
spring.data.mongodb.uri=mongodb://localhost:27017/approverdb

# Eureka Service Discovery Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Logging Level
logging.level.com.kce.kmrl=DEBUG

# Set to the same value api-gateway sends as X-Gateway-Secret to stop
# direct (gateway-bypassing) requests from forging X-User-Id/X-User-Role.
# Blank by default for local dev.
approver.security.gateway-secret=
