server.port=8082
spring.application.name=alert-service

spring.data.mongodb.uri=mongodb://localhost:27017/alert_db

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

alert.security.gateway-secret=${ALERT_GATEWAY_SECRET:}

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

alert.poll.fixed-delay-ms=30000
alert.poll.initial-delay-ms=10000

alert.integration.caller-user-id=alert-service
alert.integration.caller-role=SADA

fleet.service.url=http://fleet-service
schedule.service.url=http://schedule-service
maintenance.service.url=http://maintenance-service
approver.service.url=http://approver-service

schedule.service.trips-path=/api/v1/schedule/trips/window

alert.rules.health-index.critical-below=40

alert.rules.brake-pressure.min-kpa=850
alert.rules.brake-pressure.max-kpa=950

alert.rules.mileage.interval-km=15000
alert.rules.service.max-age-days=90

alert.rules.trip-delay.sev3-minutes=15
alert.rules.trip-unassigned.lead-minutes=15

alert.rules.maintenance-sla.open-hours=24

alert.rules.approver-sla.hours=4

resilience4j.circuitbreaker.instances.fleetService.register-health-indicator=true
resilience4j.circuitbreaker.instances.fleetService.sliding-window-size=10
resilience4j.circuitbreaker.instances.fleetService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.fleetService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.fleetService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fleetService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fleetService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.fleetService.slow-call-duration-threshold=3s
resilience4j.retry.instances.fleetService.max-attempts=3
resilience4j.retry.instances.fleetService.wait-duration=500ms
resilience4j.retry.instances.fleetService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.circuitbreaker.instances.scheduleService.register-health-indicator=true
resilience4j.circuitbreaker.instances.scheduleService.sliding-window-size=10
resilience4j.circuitbreaker.instances.scheduleService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.scheduleService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.scheduleService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.scheduleService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.scheduleService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.scheduleService.slow-call-duration-threshold=3s
resilience4j.retry.instances.scheduleService.max-attempts=3
resilience4j.retry.instances.scheduleService.wait-duration=500ms
resilience4j.retry.instances.scheduleService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.circuitbreaker.instances.maintenanceService.register-health-indicator=true
resilience4j.circuitbreaker.instances.maintenanceService.sliding-window-size=10
resilience4j.circuitbreaker.instances.maintenanceService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.maintenanceService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.maintenanceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.maintenanceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.maintenanceService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.maintenanceService.slow-call-duration-threshold=3s
resilience4j.retry.instances.maintenanceService.max-attempts=3
resilience4j.retry.instances.maintenanceService.wait-duration=500ms
resilience4j.retry.instances.maintenanceService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.circuitbreaker.instances.approverService.register-health-indicator=true
resilience4j.circuitbreaker.instances.approverService.sliding-window-size=10
resilience4j.circuitbreaker.instances.approverService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.approverService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.approverService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.approverService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.approverService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.approverService.slow-call-duration-threshold=3s
resilience4j.retry.instances.approverService.max-attempts=3
resilience4j.retry.instances.approverService.wait-duration=500ms
resilience4j.retry.instances.approverService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

alert.security.require-gateway-secret=true
alert.suppression.rearm-minutes=20
