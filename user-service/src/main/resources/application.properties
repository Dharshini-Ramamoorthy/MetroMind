# Server Configuration
server.port=8081
spring.application.name=user-service

# Oracle Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/xe}
spring.datasource.username=${DB_USERNAME:system}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Email Configuration (Gmail SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application Custom Properties
# Frontend origin for password-reset links. Falls back to the same origin
# CORS already allows in api-gateway's globalcors config, so local dev works
# without having to export this separately.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# MUST be the exact same secret api-gateway verifies tokens with (see
# api-gateway's application.yml -> jwt.secret).
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
app.jwt.expiration-ms=86400000

# Registration approval workflow ------------------------------------------
# Where this service submits USER_REGISTRATION approval tasks (direct URL,
# not Eureka lb:// - same pattern fleet-service's FLEET_OVERRIDE submission
# already uses via its own approver.service.url).
approver.service.url=${APPROVER_SERVICE_URL:http://localhost:8088}

# Shared secret approver-service must send back as X-Internal-Secret when it
# calls this service's /internal/registrations/{id}/approve|reject endpoints.
# MUST match approver-service's user.internal-secret exactly.
app.internal-secret=${INTERNAL_SERVICE_SECRET:local-dev-internal-secret-change-me}

# Admin account seeded once at startup if no SADA user exists yet (see
# AdminAccountSeeder) - the public sign-up form can never create a SADA
# account itself. Override all three via env var outside local dev, and
# change the password after first sign-in if the default was used.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@kmrl.co.in}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# Eureka Client - registers this service so the api-gateway can find it via lb://USER-SERVICE
eureka.client.username=${EUREKA_USER:eureka}
eureka.client.password=${EUREKA_PASSWORD:eureka123}
eureka.client.service-url.defaultZone=http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator (health exposed for Eureka + the gateway's circuitbreaker health group)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Resilience4j - wraps the outbound Gmail SMTP call in EmailService so a slow/down
# mail server doesn't hang the forgot-password request; falls back after retries.
resilience4j.circuitbreaker.instances.emailService.register-health-indicator=true
resilience4j.circuitbreaker.instances.emailService.sliding-window-size=10
resilience4j.circuitbreaker.instances.emailService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.emailService.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.emailService.permitted-number-of-calls-in-half-open-state=3
resilience4j.retry.instances.emailService.max-attempts=3
resilience4j.retry.instances.emailService.wait-duration=1s