server.port=8084
spring.application.name=maintenance-service

# Explicitly pass maintenance_db right in the URI path
spring.data.mongodb.uri=mongodb://localhost:27017/maintenance_db

# ---------------------------------------------------------------------
# Eureka registration - maintenance-service registers itself so
# api-gateway can route to it as lb://MAINTENANCE-SERVICE instead of a
# hardcoded host:port.
# ---------------------------------------------------------------------
eureka.client.username=${EUREKA_USER:eureka}
eureka.client.password=${EUREKA_PASSWORD:eureka123}
eureka.client.service-url.defaultZone=http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------------------------------------------------------------------
# Security - identity is resolved upstream by api-gateway and forwarded
# as X-User-Id / X-User-Role headers (see security.GatewayHeaderAuthenticationFilter).
# Set this to the same value api-gateway sends as X-Gateway-Secret to stop
# anyone who reaches maintenance-service directly from forging those headers.
# Leave blank while you're wiring things up locally.
# ---------------------------------------------------------------------
maintenance.security.gateway-secret=

# ---------------------------------------------------------------------
# Certificate of Fitness document uploads (real files now, see
# MaintenanceServiceImpl.submitCertificateOfFitness). Files are written
# to disk, not the database - for anything beyond local dev/coursework
# use, point this at a persistent, backed-up volume rather than the
# working directory default.
# ---------------------------------------------------------------------
maintenance.cof.upload-dir=./cof-uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
