server.port=8085

spring.application.name=fleet-service

spring.data.mongodb.uri=mongodb://localhost:27017/kmrl_fleet_db
spring.data.mongodb.auto-index-creation=true

logging.level.com.kce.kmrl.fleet=DEBUG

fleet.cors.allowed-origins=http://localhost:3000,http://localhost:5173
fleet.night-yard.check-interval-ms=180000

fleet.seed.force=false

# Base URL of maintenance-service. Fleet uses this to ask "which trains
# actually have an open maintenance ticket right now" instead of trusting
# its own stored status flag for the maintenance bucket.
# NOTE: once maintenance-service is also registered with Eureka you can
# drop this and let MaintenanceServiceClient call it as
# "http://maintenance-service" via a load-balanced RestTemplate instead.
maintenance.service.url=http://localhost:8084

# ---------------------------------------------------------------------
# schedule-service URL - used by client.ScheduleServiceClient so
# NightYardEnforcer can find out which trains are genuinely still
# mid-trip (ACTIVE/DELAYED) before the 23:00 yard curfew flips them to
# STANDBY, instead of doing so unconditionally and racing schedule-service.
# ---------------------------------------------------------------------
schedule.service.url=http://localhost:8086

# ---------------------------------------------------------------------
# approver-service URL - used by FleetService.requestOverride() to submit
# a FLEET_OVERRIDE approval task instead of changing a train's status
# directly.
# Confirmed against approver-service's actual application.properties
# (server.port=8088) - FLEET_OVERRIDE is a real value in its RequestType
# enum, decidable by SADA only (see ApproverServiceImpl.DECISION_OWNERS),
# and on approval it PUTs this train's status to STANDBY / on rejection to
# IN_MAINTENANCE via fleet-service's own /{trainId}/status endpoint (see
# ApproverServiceImpl.updateFleetStatus) - so this override flow now closes
# the loop correctly end to end.
# ---------------------------------------------------------------------
approver.service.url=http://localhost:8088

# ---------------------------------------------------------------------
# Eureka registration - fleet-service registers itself so api-gateway
# (and any other service) can discover it by name instead of a hardcoded
# host:port.
# ---------------------------------------------------------------------
eureka.client.username=${EUREKA_USER:eureka}
eureka.client.password=${EUREKA_PASSWORD:eureka123}
eureka.client.service-url.defaultZone=http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ---------------------------------------------------------------------
# Security - identity is resolved upstream by api-gateway and forwarded
# as X-User-Id / X-User-Role headers (see security.GatewayHeaderAuthenticationFilter).
# Set this to the same value api-gateway sends as X-Gateway-Secret to stop
# anyone who reaches fleet-service directly from forging those headers.
# Leave blank while you're wiring things up locally.
# ---------------------------------------------------------------------
fleet.security.gateway-secret=

# ---------------------------------------------------------------------
# Resilience4j - guards the outbound call to maintenance-service
# (see client.MaintenanceServiceClient).
# ---------------------------------------------------------------------
resilience4j.circuitbreaker.instances.maintenanceService.register-health-indicator=true
resilience4j.circuitbreaker.instances.maintenanceService.sliding-window-size=10
resilience4j.circuitbreaker.instances.maintenanceService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.maintenanceService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.maintenanceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.maintenanceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.maintenanceService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.maintenanceService.slow-call-duration-threshold=3s

resilience4j.retry.instances.maintenanceService.max-attempts=3
resilience4j.retry.instances.maintenanceService.wait-duration=500ms
resilience4j.retry.instances.maintenanceService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# ---------------------------------------------------------------------
# Resilience4j - guards the outbound call to schedule-service
# (see client.ScheduleServiceClient). Same shape as maintenanceService
# above; kept separate so a slow/down schedule-service can't trip the
# breaker for the (unrelated) maintenance-ticket check and vice versa.
# ---------------------------------------------------------------------
resilience4j.circuitbreaker.instances.scheduleService.register-health-indicator=true
resilience4j.circuitbreaker.instances.scheduleService.sliding-window-size=10
resilience4j.circuitbreaker.instances.scheduleService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.scheduleService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.scheduleService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.scheduleService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.scheduleService.slow-call-rate-threshold=80
resilience4j.circuitbreaker.instances.scheduleService.slow-call-duration-threshold=3s

resilience4j.retry.instances.scheduleService.max-attempts=3
resilience4j.retry.instances.scheduleService.wait-duration=500ms
resilience4j.retry.instances.scheduleService.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
